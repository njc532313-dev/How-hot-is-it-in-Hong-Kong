<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#B5BAC1">
  <title>熱壓力｜身體與環境</title>
  <style>
    :root{--brick:#C4502A;--gray:#B5BAC1;--blue:#2B6CB0;--jade:#0E9474;--ochre:#B8860B;--purple:#8A4FC4;--grid:#E4E7EB;--ink:#20364F;--paper:#f5f6f7}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth;background:var(--gray)}
    body{margin:0;color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--gray);overflow-x:hidden}
    .stage{position:sticky;top:0;height:100svh;min-height:480px;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;background:var(--gray)}
    .topline{z-index:2;display:flex;align-items:center;justify-content:space-between;padding:clamp(12px,2.3vw,28px) clamp(16px,4vw,58px) 0;font-size:clamp(.75rem,1.05vw,.9rem);font-weight:700;letter-spacing:.06em}
    .topline .mark{display:flex;align-items:center;gap:10px}
    .mark-dot{width:11px;height:11px;border-radius:50%;background:var(--brick)}
    .chapter{color:#34495e;font-variant-numeric:tabular-nums}
    .visual{height:100%;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 clamp(6px,3vw,42px)}
    #scene{width:min(100%,1160px);height:100%;max-height:calc(100svh - 108px);overflow:visible}
    .bottomline{z-index:2;display:flex;flex-direction:column;align-items:center;gap:2px;padding:0 16px clamp(14px,2vw,25px);text-align:center}
    .scroll-cue{display:flex;align-items:center;gap:9px;color:#394d62;font-size:.82rem;font-weight:650;letter-spacing:.02em}
    .scroll-cue svg{width:16px;height:16px}
    .flow-key{color:#394d62;font-size:.72rem;font-weight:600}
    .track{position:relative;margin-top:-100svh;pointer-events:none}
    .beat{height:100svh;min-height:480px}
    .sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .part{opacity:0}.person,.opening{opacity:1}
    .dash{stroke-dasharray:8 12}
    .pulse{transform-box:fill-box;transform-origin:center}
    .tag{fill:#F7F8FA;stroke:#E4E7EB;stroke-width:2}
    .tagtext{fill:#20364F;font:700 18px ui-sans-serif,system-ui,sans-serif}
    .subtag{fill:#20364F;font:600 13px ui-sans-serif,system-ui,sans-serif;opacity:.82}
    .motionline{fill:none;stroke-linecap:round;stroke-linejoin:round}
    @media(max-width:650px){
      .stage{min-height:440px}.topline{padding-top:13px}.visual{padding:0;overflow:hidden}#scene{width:155vw;max-width:none;height:auto;max-height:calc(100svh - 96px);flex:none}.bottomline{padding-bottom:12px}.beat{min-height:440px}.topline .descriptor{max-width:58%;text-align:right;line-height:1.25}
      .humidity>.tag,.humidity>text,.temperature>.tag,.temperature>text,.sun>.tag,.sun>text,.sun>circle,.sun>g,.wind>.tag,.wind>text{display:none}
      .tagtext{font-size:21px}.subtag{font-size:14px}
    }
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <main>
    <section class="stage" aria-label="身體熱壓力捲動動畫">
      <header class="topline"><span class="mark"><i class="mark-dot" aria-hidden="true"></i>身體 × 環境</span><span class="descriptor">捲動，逐步看見熱量如何進出</span><span class="chapter" id="chapter" aria-hidden="true">01 / 08</span></header>
      <div class="visual">
        <svg id="scene" viewBox="0 0 900 850" role="img" aria-labelledby="scene-title scene-description">
          <title id="scene-title">環境與活動共同影響熱壓力</title>
          <desc id="scene-description">中央是一位正面站立的卡通人物。太陽輻射和較熱空氣的箭頭指向身體；活動在身體內產熱。汗水蒸發、合適條件下的風和較涼空氣，以離開身體的箭頭表示散熱。氣溫和風的實際作用取決於環境。當產熱和吸收熱量持續多於散出熱量，熱量可能在體內積聚。</desc>
          <defs>
            <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#2B6CB0" stroke-width="1.8"/></marker>
            <marker id="arrow-brick" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#C4502A" stroke-width="1.8"/></marker>
            <marker id="arrow-jade" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#0E9474" stroke-width="1.8"/></marker>
            <marker id="arrow-ochre" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#B8860B" stroke-width="1.8"/></marker>
            <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#8A4FC4" stroke-width="1.8"/></marker>
          </defs>
          <g class="person"><image href="person-cartoon.png" x="269" y="98" width="402" height="603"/></g>
          <!-- humidity: sweat appears, then evaporates or stays on skin -->
          <g class="part humidity">
            <rect x="34" y="363" width="194" height="66" rx="33" class="tag"/>
            <text x="131" y="390" text-anchor="middle" class="tagtext">濕度</text><text x="131" y="411" text-anchor="middle" class="subtag">Humidity · 影響蒸發</text>
            <path d="M225 397q76 0 156-57" class="motionline dash" stroke="#20364F" stroke-width="2.5" opacity=".55" fill="none"/>
            <path d="M391 326q12 19 0 28-12-8 0-28m20 2q12 19 0 28-12-8 0-28m-29 32q10 15 0 23-10-7 0-23" fill="#2B6CB0"/>
            <g class="part dry-air">
              <path class="heat-out" d="M379 331q-13-49-3-82m31 83q4-39 30-66m-47 61q-27-31-29-55" fill="none" stroke="#2B6CB0" stroke-width="3" marker-end="url(#arrow-blue)"/>
              <circle cx="371" cy="234" r="5" fill="#2B6CB0"/><circle cx="440" cy="259" r="4" fill="#2B6CB0"/>
            </g>
            <g class="part humid-air">
              <path d="M382 337q-7-20-8-36m25 26q7-17 8-27" fill="none" stroke="#2B6CB0" stroke-width="3" stroke-dasharray="2 10" opacity=".55"/>
              <path d="M396 363q12 20 0 29-12-8 0-29m23-15q11 17 0 25-11-7 0-25m-42 34q10 16 0 24-10-7 0-24" fill="#2B6CB0"/>
            </g>
          </g>
          <!-- air temperature -->
          <g class="part temperature">
            <rect x="671" y="171" width="195" height="66" rx="33" class="tag"/>
            <text x="768" y="198" text-anchor="middle" class="tagtext">空氣溫度</text><text x="768" y="219" text-anchor="middle" class="subtag">較熱吸熱 · 較涼散熱</text>
            <path class="heat-in" d="M676 257q-46 22-88 62" fill="none" stroke="#C4502A" stroke-width="4" marker-end="url(#arrow-brick)"/>
            <path class="heat-out" d="M550 281q47-30 105-29" fill="none" stroke="#2B6CB0" stroke-width="4" marker-end="url(#arrow-blue)"/>
            <text x="624" y="288" text-anchor="middle" class="subtag">較熱</text><text x="603" y="243" text-anchor="middle" class="subtag">較涼</text>
            <path d="M811 266q-28 39-2 69m23-65q-13 28 1 48" fill="none" stroke="#C4502A" stroke-width="3" stroke-linecap="round"/>
          </g>
          <!-- solar radiation -->
          <g class="part sun">
            <circle cx="161" cy="177" r="37" fill="#B8860B"/>
            <g stroke="#B8860B" stroke-width="6" stroke-linecap="round"><path d="M161 118v-19m0 155v-19m-59-58H83m156 0h-19m-101-42-14-14m110 110-14-14m0-82 14-14m-110 110-14 14"/></g>
            <rect x="44" y="244" width="232" height="66" rx="33" class="tag"/>
            <text x="160" y="271" text-anchor="middle" class="tagtext">太陽輻射</text><text x="160" y="292" text-anchor="middle" class="subtag">Solar radiation · 吸熱</text>
            <path class="heat-in" d="M248 193q106 39 175 104m-146-50q74 26 107 66" fill="none" stroke="#B8860B" stroke-width="4" marker-end="url(#arrow-ochre)"/>
          </g>
          <!-- wind, drawn as exchange rather than guaranteed cooling -->
          <g class="part wind">
            <path class="heat-out" d="M586 329q130-43 269 9m-267 17q136-39 272 11m-271 104q132-20 260 20" fill="none" stroke="#0E9474" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-jade)"/>
            <path class="dash" d="M626 480q38 4 70-1" fill="none" stroke="#0E9474" stroke-width="3"/>
            <rect x="674" y="394" width="193" height="66" rx="33" class="tag"/>
            <text x="770" y="421" text-anchor="middle" class="tagtext">風</text><text x="770" y="442" text-anchor="middle" class="subtag">合適條件下助散熱</text>
          </g>
          <!-- body heat from activity -->
          <g class="part activity">
            <ellipse cx="492" cy="381" rx="94" ry="112" fill="none" stroke="#8A4FC4" stroke-width="4" stroke-dasharray="5 12" class="pulse"/>
            <path d="M456 341q15-16 30 0t30 0m-66 25q16-16 31 0t31 0m-64 25q15-15 29 0t29 0" fill="none" stroke="#8A4FC4" stroke-width="6" stroke-linecap="round"/>
            <path class="heat-internal" d="M477 377q-36-14-73-8m82 9q35-17 69-11m-76 26q-5 34 2 66" fill="none" stroke="#8A4FC4" stroke-width="4" marker-end="url(#arrow-purple)"/>
            <rect x="330" y="684" width="281" height="66" rx="33" class="tag"/>
            <text x="470" y="711" text-anchor="middle" class="tagtext">身體活動</text><text x="470" y="732" text-anchor="middle" class="subtag">Physical activity · 產熱</text>
            <path d="M469 682q2-38 11-66" fill="none" stroke="#20364F" stroke-width="2.5" stroke-dasharray="5 8" opacity=".55"/>
          </g>
          <!-- final convergence -->
          <g class="part converge">
            <ellipse cx="470" cy="426" rx="162" ry="282" fill="none" stroke="#C4502A" stroke-width="5" opacity=".62"/>
            <text x="470" y="770" text-anchor="middle" class="subtag">產熱與吸熱持續超過散熱</text>
            <rect x="333" y="778" width="275" height="56" rx="28" fill="#C4502A"/>
            <text x="470" y="814" text-anchor="middle" style="font:700 20px ui-sans-serif,system-ui,sans-serif;fill:#F7F8FA">Heat stress · 熱壓力</text>
          </g>
          <!-- opening prompt -->
          <g class="part opening" id="opening" style="opacity:1">
            <rect x="286" y="20" width="368" height="58" rx="29" fill="#F7F8FA" stroke="#E4E7EB" stroke-width="2"/>
            <text x="470" y="57" text-anchor="middle" style="font:700 22px ui-sans-serif,system-ui,sans-serif;fill:#20364F">天氣熱時，身體如何散熱？</text>
          </g>
        </svg>
      </div>
      <footer class="bottomline"><span class="scroll-cue"><svg aria-hidden="true" viewBox="0 0 20 20" fill="none"><path d="M10 3v13m-5-5 5 5 5-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="cue">向下捲動</span></span><span class="flow-key">向內＝吸熱　向外＝散熱　體內＝產熱</span></footer>
    </section>
    <div class="track" aria-hidden="true">
      <div class="beat"></div><div class="beat"></div><div class="beat"></div><div class="beat"></div>
      <div class="beat"></div><div class="beat"></div><div class="beat"></div><div class="beat"></div>
    </div>
    <ul class="sr-only">
      <li>汗水蒸發，才會帶走熱量。較乾燥時，汗水較容易蒸發；濕度高時，汗水較難蒸發。</li>
      <li>較熱空氣可向身體輸入熱量；較涼空氣可讓熱量由身體散出。氣溫影響熱交換的方向。</li><li>太陽輻射向身體輸入額外熱量。</li>
      <li>有利條件下，風可促進蒸發與散熱；效果視當時環境而定。</li><li>步行、跑步和遠足會在身體內產熱，熱量從內部傳向皮膚。</li>
      <li>當產熱和吸收的熱量持續多於散出的熱量，熱量可能在體內積聚，增加熱相關疾病風險。熱壓力並非個人健康診斷。</li>
    </ul>
  </main>
  <noscript><style>.part{opacity:1}.dry-air,.opening{opacity:0}</style></noscript>
  <script src="vendor/gsap.min.js"></script>
  <script src="vendor/ScrollTrigger.min.js"></script>
  <script>
    const chapter=document.querySelector('#chapter');
    const cue=document.querySelector('#cue');
    const names=['引導','汗水蒸發 → 散熱','濕度高 → 蒸發減少','較熱空氣吸熱 · 較涼空氣散熱','太陽輻射 → 熱量輸入','風在合適條件下 → 助散熱','身體活動 → 體內產熱','熱量積聚 → 熱壓力'];
    const showChapter=index=>{
      chapter.textContent=`${String(index+1).padStart(2,'0')} / 08`;
      cue.textContent=names[index];
    };
    gsap.registerPlugin(ScrollTrigger);
    gsap.set('.part:not(.opening)',{autoAlpha:0});
    document.querySelectorAll('.heat-in,.heat-out,.heat-internal').forEach(path=>{
      const length=path.getTotalLength();
      gsap.set(path,{strokeDasharray:length,strokeDashoffset:length});
    });
    const media=gsap.matchMedia();
    media.add('(prefers-reduced-motion: no-preference)',()=>{
      const timeline=gsap.timeline({
        defaults:{ease:'none'},
        scrollTrigger:{
          trigger:'.track',start:'top top',end:'bottom bottom',scrub:0.35,
          onUpdate:self=>showChapter(Math.min(7,Math.floor(self.progress*8)))
        }
      });
      timeline
        .to('#opening',{autoAlpha:0,duration:.3},.6)
        .to('.humidity',{autoAlpha:1,duration:.3},1)
        .to('.dry-air',{autoAlpha:1,duration:.25},1.05)
        .fromTo('.dry-air circle',{y:18,opacity:0},{y:-18,opacity:1,duration:.75,immediateRender:false},1.15)
        .to('.dry-air .heat-out',{strokeDashoffset:0,duration:.7},1.1)
        .to('.humidity .dash',{strokeDashoffset:-48,duration:.8},1.1)
        .to('.dry-air',{autoAlpha:0,duration:.25},1.8)
        .to('.humid-air',{autoAlpha:1,duration:.3},2)
        .from('.humid-air path:last-child',{y:-12,duration:.55,immediateRender:false},2.05)
        .to('.temperature',{autoAlpha:1,duration:.35},3)
        .to('.temperature .heat-in',{strokeDashoffset:0,duration:.65},3.05)
        .to('.temperature .heat-out',{strokeDashoffset:0,duration:.65},3.18)
        .to('.sun',{autoAlpha:1,duration:.35},4)
        .to('.sun .heat-in',{strokeDashoffset:0,duration:.7},4.05)
        .to('.wind',{autoAlpha:1,duration:.35},5)
        .to('.wind .heat-out',{strokeDashoffset:0,duration:.7},5.05)
        .to('.wind .dash',{strokeDashoffset:-55,duration:.8},5.1)
        .to('.activity',{autoAlpha:1,duration:.35},6)
        .fromTo('.activity .pulse',{scale:.9,svgOrigin:'492 381'},{scale:1.07,svgOrigin:'492 381',duration:.85,immediateRender:false},6.1)
        .to('.activity .heat-internal',{strokeDashoffset:0,duration:.75},6.1)
        .to('.converge',{autoAlpha:1,duration:.4},7)
        .from('.converge ellipse',{scale:.92,svgOrigin:'470 426',duration:.5,immediateRender:false},7)
        .to({},{duration:.6},7.4);
      return ()=>timeline.kill();
    });
    media.add('(prefers-reduced-motion: reduce)',()=>{
      gsap.set('.part',{autoAlpha:1});
      gsap.set('.dry-air, #opening',{autoAlpha:0});
      gsap.set('.heat-in,.heat-out,.heat-internal',{strokeDashoffset:0});
      chapter.textContent='完整圖解';
      cue.textContent='熱壓力';
    });
  </script>
</body>
</html>
